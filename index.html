<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion Fourgon ESP32</title>
  <!-- Librairie Chart.js pour le graphique -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --btn-bg: #334155;
      --btn-active: #0284c7;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #fbbf24;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--accent-color);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 9999px;
      font-weight: bold;
      background-color: var(--btn-bg);
    }
    .status-badge.on { background-color: var(--success); color: #000; }
    .status-badge.off { background-color: var(--danger); color: #fff; }

    /* Auth & Connexion */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    input[type="password"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--btn-bg);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 1rem;
    }

    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background-color: var(--btn-bg);
      color: var(--text-color);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    button.btn-primary {
      background-color: var(--accent-color);
      color: #000;
      width: 100%;
    }

    /* Grille de températures (adaptée à 4 capteurs) */
    .temp-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      text-align: center;
    }

    .temp-box {
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 4px;
      border-radius: 8px;
    }

    .temp-value {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .temp-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Conteneur Graphique */
    .chart-container {
      position: relative;
      height: 280px;
      width: 100%;
    }

    /* Commandes de Relais */
    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn-group button.active {
      background-color: var(--btn-active);
      color: #fff;
    }

    /* Logs BLE */
    .console {
      font-family: monospace;
      font-size: 0.75rem;
      background: #000;
      color: #38bdf8;
      padding: 10px;
      border-radius: 8px;
      height: 90px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚐 Control Panel Van</h1>

    <!-- CARTE CONNEXION -->
    <div class="card">
      <div class="card-title">Connexion Bluetooth</div>
      <div class="input-group">
        <input type="password" id="passwordInput" placeholder="Mot de passe" value="2803">
      </div>
      <button class="btn-primary" id="connectBtn" onclick="toggleConnect()">Se connecter</button>
    </div>

    <!-- CARTE TEMPÉRATURES EN DIRECT (4 Capteurs) -->
    <div class="card">
      <div class="card-title">Températures en direct</div>
      <div class="temp-grid">
        <div class="temp-box">
          <div class="temp-value" id="valTempInt">-- °C</div>
          <div class="temp-label">Intérieur</div>
        </div>
        <div class="temp-box">
          <div class="temp-value" id="valTempExt">-- °C</div>
          <div class="temp-label">Extérieur</div>
        </div>
        <div class="temp-box">
          <div class="temp-value" id="valTempParois">-- °C</div>
          <div class="temp-label">Parois Frigo</div>
        </div>
        <div class="temp-box">
          <div class="temp-value" id="valTempHotte" style="color: #c084fc;">-- °C</div>
          <div class="temp-label">Hotte Cuisine</div>
        </div>
      </div>
    </div>

    <!-- CARTE GRAPHIQUE HISTORIQUE 3 JOURS -->
    <div class="card">
      <div class="card-title">
        <span>📈 Historique (3 jours)</span>
        <button style="padding: 4px 8px; font-size: 0.7rem;" onclick="sendCommand('get_hist')">Actualiser</button>
      </div>
      <div class="chart-container">
        <canvas id="tempChart"></canvas>
      </div>
    </div>

    <!-- COMMANDES DE RELAIS -->

    <!-- 1. VMC -->
    <div class="card">
      <div class="card-title">
        <span>🌀 VMC</span>
        <span class="status-badge" id="badgeVMC">OFF</span>
      </div>
      <div class="btn-group">
        <button id="btn-vmc-auto" onclick="sendCommand('vmc auto')">AUTO</button>
        <button id="btn-vmc-on" onclick="sendCommand('vmc on')">ON</button>
        <button id="btn-vmc-off" onclick="sendCommand('vmc off')">OFF</button>
      </div>
    </div>

    <!-- 2. FRIGO PRINCIPAL -->
    <div class="card">
      <div class="card-title">
        <span>❄️ Frigo Principal</span>
        <span class="status-badge" id="badgeFrigo">OFF</span>
      </div>
      <div class="btn-group">
        <button id="btn-frigo-auto" onclick="sendCommand('frigo auto')">AUTO</button>
        <button id="btn-frigo-on" onclick="sendCommand('frigo on')">ON</button>
        <button id="btn-frigo-off" onclick="sendCommand('frigo off')">OFF</button>
      </div>
    </div>

    <!-- 3. FRIGO EXTRÊME (GPIO 48) -->
    <div class="card">
      <div class="card-title">
        <span>🚀 Frigo Extreme Cool Down</span>
        <span class="status-badge" id="badgeCool">OFF</span>
      </div>
      <div class="btn-group">
        <button id="btn-cool-auto" onclick="sendCommand('cool down auto')">AUTO</button>
        <button id="btn-cool-on" onclick="sendCommand('cool down on')">ON</button>
        <button id="btn-cool-off" onclick="sendCommand('cool down off')">OFF</button>
      </div>
    </div>

    <!-- 4. LUMIÈRE -->
    <div class="card">
      <div class="card-title">
        <span>💡 Lumière</span>
        <span class="status-badge" id="badgeLight">OFF</span>
      </div>
      <div class="btn-group">
        <button id="btn-light-auto" onclick="sendCommand('light auto')">AUTO</button>
        <button id="btn-light-on" onclick="sendCommand('light on')">ON</button>
        <button id="btn-light-off" onclick="sendCommand('light off')">OFF</button>
      </div>
    </div>

    <!-- CONSOLE LOG -->
    <div class="card">
      <div class="card-title">Console BLE</div>
      <div class="console" id="consoleLog">En attente de connexion...\n</div>
    </div>
  </div>

  <script>
    // --- UUIDs BLE (Nordic NUS) ---
    const SERVICE_UUID           = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let gattServer = null;
    let rxCharacteristic = null;
    let txCharacteristic = null;

    // Buffer d'historique (comprenant la Hotte)
    let tempChart = null;
    let bufferHist = { labels: [], int: [], ext: [], parois: [], hotte: [], frigo: [] };

    // Initialisation du Graphique
    function initChart() {
      const ctx = document.getElementById('tempChart').getContext('2d');
      tempChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            {
              label: 'Int (°C)',
              data: [],
              borderColor: '#38bdf8',
              backgroundColor: 'rgba(56, 189, 248, 0.1)',
              borderWidth: 2,
              pointRadius: 0,
              tension: 0.2,
              yAxisID: 'y'
            },
            {
              label: 'Ext (°C)',
              data: [],
              borderColor: '#34d399',
              backgroundColor: 'rgba(52, 211, 153, 0.1)',
              borderWidth: 2,
              pointRadius: 0,
              tension: 0.2,
              yAxisID: 'y'
            },
            {
              label: 'Parois (°C)',
              data: [],
              borderColor: '#f43f5e',
              backgroundColor: 'rgba(244, 63, 94, 0.1)',
              borderWidth: 2,
              pointRadius: 0,
              tension: 0.2,
              yAxisID: 'y'
            },
            {
              label: 'Hotte (°C)',
              data: [],
              borderColor: '#c084fc',
              backgroundColor: 'rgba(192, 132, 252, 0.1)',
              borderWidth: 2,
              pointRadius: 0,
              tension: 0.2,
              yAxisID: 'y'
            },
            {
              label: 'Relais Frigo',
              data: [],
              borderColor: '#fbbf24',
              backgroundColor: 'rgba(251, 191, 36, 0.15)',
              borderWidth: 1.5,
              pointRadius: 0,
              stepped: true, // Affichage en créneaux ON/OFF
              fill: true,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              ticks: { color: '#94a3b8', font: { size: 9 }, maxTicksLimit: 12 },
              grid: { color: 'rgba(255, 255, 255, 0.05)' }
            },
            y: {
              type: 'linear',
              display: true,
              position: 'left',
              min: -10,
              max: 60,
              ticks: { color: '#94a3b8', font: { size: 10 }, stepSize: 10 },
              grid: { color: 'rgba(255, 255, 255, 0.1)' }
            },
            y1: {
              type: 'linear',
              display: true,
              position: 'right',
              min: 0,
              max: 1.2,
              ticks: {
                stepSize: 1,
                callback: function(val) {
                  if (val === 0) return 'OFF';
                  if (val === 1) return 'ON';
                  return '';
                },
                color: '#fbbf24',
                font: { size: 9, weight: 'bold' }
              },
              grid: { drawOnChartArea: false }
            }
          },
          plugins: {
            legend: {
              labels: { color: '#f8fafc', font: { size: 10 }, boxWidth: 10 }
            }
          }
        }
      });
    }

    window.onload = () => {
      initChart();
    };

    function log(text) {
      const consoleElem = document.getElementById('consoleLog');
      consoleElem.textContent += text + "\n";
      consoleElem.scrollTop = consoleElem.scrollHeight;
    }

    async function toggleConnect() {
      if (gattServer && gattServer.connected) {
        disconnectBLE();
      } else {
        connectBLE();
      }
    }

    async function connectBLE() {
      try {
        log("Recherche de l'ESP32...");
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Fourgon-ESP32' }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log("Connexion au serveur GATT...");
        gattServer = await bleDevice.gatt.connect();

        log("Récupération du service UART...");
        const service = await gattServer.getPrimaryService(SERVICE_UUID);

        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
        txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);

        log("Connexion établie ! Authentification...");
        document.getElementById('connectBtn').textContent = "Déconnecter";
        document.getElementById('connectBtn').style.backgroundColor = "var(--danger)";

        const pwd = document.getElementById('passwordInput').value;
        await sendCommand("AUTH:" + pwd);

      } catch (error) {
        log("Erreur : " + error);
      }
    }

    function disconnectBLE() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    }

    function onDisconnected() {
      log("Déconnecté du BLE.");
      document.getElementById('connectBtn').textContent = "Se connecter";
      document.getElementById('connectBtn').style.backgroundColor = "var(--accent-color)";
    }

    async function sendCommand(cmd) {
      if (!rxCharacteristic) {
        log("Erreur: Non connecté au BLE");
        return;
      }
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(cmd + "\n"));
        log("--> " + cmd);
      } catch (err) {
        log("Erreur envoi: " + err);
      }
    }

    function handleBLEData(event) {
      const decoder = new TextDecoder('utf-8');
      const text = decoder.decode(event.target.value);

      const lines = text.split('\n');
      lines.forEach(line => {
        const cleanLine = line.trim();
        if (!cleanLine) return;

        // 1. Début de réception de l'historique
        if (cleanLine === "HIST_START") {
          bufferHist = { labels: [], int: [], ext: [], parois: [], hotte: [], frigo: [] };
          log("Réception de l'historique 3 jours...");
          return;
        }

        // 2. Fin de réception -> Traitement & affichage sur le graphique
        if (cleanLine === "HIST_END") {
          if (tempChart) {
            tempChart.data.labels = bufferHist.labels;
            tempChart.data.datasets[0].data = bufferHist.int;
            tempChart.data.datasets[1].data = bufferHist.ext;
            tempChart.data.datasets[2].data = bufferHist.parois;
            tempChart.data.datasets[3].data = bufferHist.hotte;
            tempChart.data.datasets[4].data = bufferHist.frigo;
            tempChart.update();
          }
          log("Graphique mis à jour !");
          return;
        }

        // 3. Traitement des points "H:minutes,tInt,tExt,tParois,tHotte,etatFrigo"
        if (cleanLine.startsWith("H:")) {
          const parts = cleanLine.substring(2).split(',');
          if (parts.length >= 6) {
            const minAgo = parseInt(parts[0]);
            const tI = parseFloat(parts[1]);
            const tE = parseFloat(parts[2]);
            const tP = parseFloat(parts[3]);
            const tH = parseFloat(parts[4]);
            const etatF = parseInt(parts[5]);

            // Formateur d'échelle de temps sur 3 jours (-72h)
            let timeLabel = "";
            if (minAgo === 0) {
              timeLabel = "Maint.";
            } else if (minAgo >= 60) {
              const h = Math.floor(minAgo / 60);
              const m = minAgo % 60;
              timeLabel = m > 0 ? `-${h}h${m}` : `-${h}h`;
            } else {
              timeLabel = `-${minAgo}m`;
            }

            bufferHist.labels.push(timeLabel);
            bufferHist.int.push(tI);
            bufferHist.ext.push(tE);
            bufferHist.parois.push(tP);
            bufferHist.hotte.push(tH);
            bufferHist.frigo.push(etatF);
          }
          return;
        }

        // 4. Données instantanées "DATA:tInt,tExt,tParois,tHotte,etatFrigo"
        if (cleanLine.startsWith("DATA:")) {
          const parts = cleanLine.substring(5).split(',');
          if (parts.length >= 4) {
            document.getElementById('valTempInt').textContent = parts[0] + " °C";
            document.getElementById('valTempExt').textContent = parts[1] + " °C";
            document.getElementById('valTempParois').textContent = parts[2] + " °C";
            document.getElementById('valTempHotte').textContent = parts[3] + " °C";
          }
          return;
        }

        // 5. Mise à jour des états visuels des relais
        if (cleanLine.includes("VMC:") && cleanLine.includes("FRIGO:")) {
          updateRelayUI('VMC', cleanLine.includes("VMC: ON"), cleanLine);
          updateRelayUI('Frigo', cleanLine.includes("FRIGO: ON"), cleanLine);
        }

        if (cleanLine.includes("LIGHT:") && cleanLine.includes("EXTREME:")) {
          updateRelayUI('Light', cleanLine.includes("LIGHT: ON"), cleanLine);
          updateRelayUI('Cool', cleanLine.includes("EXTREME: ON"), cleanLine);
        }

        if (!cleanLine.startsWith("H:")) {
          log("<-- " + cleanLine);
        }
      });
    }

    function updateRelayUI(name, isOn, line) {
      const badge = document.getElementById(`badge${name}`);
      if (badge) {
        badge.textContent = isOn ? "ON" : "OFF";
        badge.className = `status-badge ${isOn ? 'on' : 'off'}`;
      }

      const prefix = name.toLowerCase();
      ['auto', 'on', 'off'].forEach(mode => {
        const btn = document.getElementById(`btn-${prefix}-${mode}`);
        if (btn && line.includes(`(${mode.toUpperCase()})`)) {
          ['auto', 'on', 'off'].forEach(m => {
            const b = document.getElementById(`btn-${prefix}-${m}`);
            if (b) b.classList.remove('active');
          });
          btn.classList.add('active');
        }
      });
    }
  </script>
</body>
</html>
